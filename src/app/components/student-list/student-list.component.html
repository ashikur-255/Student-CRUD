<div class="container mt-5">

    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-primary mb-1">Student Management</h2>
            <p class="text-muted mb-0">Manage student records easily</p>
        </div>

        <a routerLink="/add" class="btn btn-primary shadow-sm px-4">
            <i class="bi bi-plus-circle me-2"></i>
            Add Student
        </a>
    </div>

    <!-- Card -->
    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-4">

            <!-- Table -->
            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Age</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr *ngFor="let student of students">

                            <td>
                                <span class="badge bg-secondary">
                                    #{{ student.id }}
                                </span>
                            </td>

                            <td class="fw-semibold">
                                {{ student.name }}
                            </td>

                            <td>
                                {{ student.department }}
                            </td>

                            <td>
                                {{ student.age }}
                            </td>

                            <td class="text-center">

                                <a
                                    [routerLink]="['/edit', student.id]"
                                    class="btn btn-warning btn-sm me-2 px-3">
                                    Edit
                                </a>

                                <button
                                    (click)="deleteStudent(student.id)"
                                    class="btn btn-danger btn-sm px-3">
                                    Delete
                                </button>

                            </td>

                        </tr>

                        <!-- Empty Data -->
                        <tr *ngIf="students.length === 0">
                            <td colspan="5" class="text-center text-muted py-4">
                                No students found
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
